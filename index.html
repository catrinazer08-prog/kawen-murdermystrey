<style>
:root{--ink:#0b0506;--wine:#4a0b16;--crimson:#7a1224;--gold:#cfae62;--gold2:#ecd9a4;--pearl:#f4efe6;--cream:#efe6d2;--muted:#b9a99a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--pearl);font-family:'Cairo',sans-serif;line-height:1.7}
.cin{font-family:'Cinzel',serif;letter-spacing:.28em;text-transform:uppercase}
html[lang=ar] .cin{font-family:'Cairo',sans-serif;letter-spacing:0;font-weight:700}
.script{font-family:'Playfair Display',serif;font-style:italic}
.wrap{max-width:860px;margin:auto;padding:0 20px}
.pearls{height:12px;width:min(220px,60%);margin:18px auto;background:radial-gradient(circle 5.5px at 8px 6px,#fff 0,#eadfca 55%,#a89c84 88%,transparent 100%) 0 0/16px 12px repeat-x}
.lang{position:absolute;top:16px;inset-inline-end:16px;z-index:3;border:1px solid rgba(207,174,98,.5);background:rgba(11,5,6,.6);color:var(--gold2);padding:6px 14px;border-radius:99px;font:600 12px 'Cairo',sans-serif;cursor:pointer}
.lang:hover{border-color:var(--gold)}

.hero{position:relative;text-align:center;padding:64px 20px 90px;overflow:hidden;background:radial-gradient(ellipse at 50% 0,#6b0f20 0,#2a050c 45%,#0b0506 80%)}
.hero::before,.hero::after{content:"";position:absolute;top:-30px;width:180px;height:260px;opacity:.16;background:linear-gradient(115deg,transparent 40%,var(--pearl) 41%,transparent 43%),radial-gradient(ellipse at 0 50%,var(--pearl),transparent 70%);border-radius:0 100% 0 100%}
.hero::before{left:-40px;transform:rotate(18deg)}
.hero::after{right:-40px;transform:scaleX(-1) rotate(18deg)}
.crest{width:104px;height:132px;margin:0 auto 22px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 5px var(--ink),inset 0 0 0 6px var(--gold),0 0 30px rgba(207,174,98,.25);font:700 20px 'Cinzel',serif;color:var(--gold2);letter-spacing:.08em}
.hero .cin{font-size:12px;color:var(--gold)}
h1{font:500 clamp(34px,8vw,58px)/1.15 'Playfair Display',serif;font-style:italic;margin:10px 0 4px;background:linear-gradient(90deg,var(--gold2),var(--pearl),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.ar-title{font-size:clamp(22px,5vw,32px);font-weight:700}
.pills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:26px}
.pill{border:1px solid rgba(207,174,98,.5);background:rgba(11,5,6,.55);padding:7px 16px;border-radius:99px;font-size:13px;color:var(--gold2)}
.cta{display:inline-block;margin-top:30px;padding:13px 34px;border-radius:4px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a050c;font-weight:700;text-decoration:none}

.welcome{background:linear-gradient(var(--ink),var(--wine) 60%,var(--ink));text-align:center;padding:60px 0}
.welcome h2{font-size:15px;color:var(--gold)}
.welcome p{max-width:560px;margin:14px auto 0;color:#e6d8cc;font-size:17px}

.info{background:var(--cream);color:#3a1a14;padding:38px 0}
.info .grid{display:grid;grid-template-columns:repeat(3,1fr)}
.info .col{text-align:center;padding:6px 18px;border-inline-start:1px solid rgba(58,26,20,.25)}
.info .col:first-child{border:0}
.info .cin{font-size:11px;color:#8a6a2c;margin-bottom:6px;display:block}
.info b{display:block;font-size:17px}
.info small{color:#6d4a3d}

.dress{background:#000;text-align:center;padding:42px 20px}
.dress .cin{font-size:12px;color:var(--gold)}
.sw{display:flex;gap:16px;justify-content:center;margin:18px 0 10px}
.sw i{width:44px;height:44px;border-radius:50%;border:1px solid rgba(207,174,98,.6)}
.dress p{font-size:13px;color:var(--muted)}

.reg{padding:70px 0;background:radial-gradient(ellipse at 50% 100%,#3a0811,var(--ink) 70%)}
.sec-h{text-align:center;margin-bottom:26px}
.sec-h .cin{font-size:12px;color:var(--gold)}
.sec-h h2{font-size:28px;font-weight:700}
.card{background:linear-gradient(150deg,rgba(74,11,22,.85),rgba(11,5,6,.95));border:1px solid rgba(207,174,98,.45);border-radius:14px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.steps{display:flex;gap:8px;margin-bottom:22px}
.steps span{flex:1;height:3px;border-radius:3px;background:rgba(207,174,98,.2)}
.steps span.on{background:var(--gold)}
label{display:block;font-size:12px;color:var(--gold);margin:14px 0 4px;font-weight:600}
input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid rgba(207,174,98,.4);background:rgba(11,5,6,.8);color:var(--pearl);font:inherit}
input:focus{outline:none;border-color:var(--gold)}
html[dir=rtl] #ph{text-align:right}
html[dir=ltr] #ph{text-align:left}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;max-height:300px;overflow-y:auto;padding:2px}
#gd{max-height:none}
.opt{border:1px solid rgba(207,174,98,.3);background:rgba(43,5,11,.7);border-radius:8px;padding:11px 13px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:.25s}
.opt:hover:not(.lock){border-color:var(--gold);transform:translateY(-2px)}
.opt.sel{border-color:var(--gold2);background:linear-gradient(135deg,var(--crimson),var(--wine));box-shadow:0 0 14px rgba(207,174,98,.3)}
.opt.lock{opacity:.4;cursor:not-allowed;filter:grayscale(.9)}
.opt.lock .nm{text-decoration:line-through}
.opt em{font-style:normal;font-size:10px;border:1px solid #777;color:#aaa;padding:1px 6px;border-radius:4px;white-space:nowrap}
.opt small{display:block;font-size:10px;color:var(--muted)}
.opt.sel small{color:var(--gold2)}
.nav{display:flex;justify-content:space-between;margin-top:24px}
.btn{padding:11px 24px;border-radius:6px;border:1px solid rgba(207,174,98,.5);background:none;color:var(--gold2);font:inherit;cursor:pointer}
.btn.pri{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a050c;font-weight:700;border:0}
.btn:disabled{opacity:.6;cursor:wait}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.err{color:#ff8a8a;font-size:12px;margin-top:6px;display:none}
.err.show{display:block}
.step{display:none}.step.on{display:block}
.done{text-align:center}
.done h3{font-size:24px;color:var(--gold2)}
.dos{max-width:420px;margin:22px auto 0;border:1px solid var(--gold);border-radius:12px;padding:22px;background:linear-gradient(160deg,var(--wine),var(--ink));text-align:start}
.dos .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(207,174,98,.2);font-size:14px}
.dos .row span:first-child{color:var(--muted);font-size:12px}
.dos .row b{color:var(--gold2)}

.sch{padding:70px 0;background:linear-gradient(var(--ink),var(--wine))}
.edge{border:1px solid rgba(207,174,98,.45);border-radius:12px;padding:20px;text-align:center;background:rgba(11,5,6,.55)}
.edge time{font:700 28px 'Cinzel',serif;color:var(--gold2);display:block;direction:ltr}
.edge p{margin-top:4px;font-size:14px;color:#e6d8cc}
.mid-t{text-align:center;color:var(--gold);font-size:13px;margin-top:6px}
.mid{margin:14px 0 4px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.act{border:1px solid rgba(207,174,98,.3);border-radius:10px;padding:16px 10px;text-align:center;background:rgba(43,5,11,.7);font-size:14px}
.act i{font-style:normal;display:block;font-size:22px;color:var(--gold);margin-bottom:6px}
footer{text-align:center;padding:34px 20px;font-size:12px;color:var(--muted);border-top:1px solid rgba(207,174,98,.25)}
@media(max-width:640px){.info .grid{grid-template-columns:1fr;gap:18px}.info .col{border:0}.opts{grid-template-columns:1fr}.mid{grid-template-columns:1fr 1fr}}
</style>
</head>

let lang='ar',gender=null,ch=null,jb=null,tc=[],tj=[],done=false;
const $=id=>document.getElementById(id);
const t=k=>D[lang][k];
const ok_=()=>URL_&&URL_.indexOf('PASTE_')!==0;
const jobTxt=j=>lang==='en'?j[3]:(gender==='female'?j[2]:j[1]);
const chTxt=c=>lang==='en'?c[2]:c[1];

function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.dataset.i)});
  $('lb').textContent=lang==='ar'?'English':'العربية';
  document.title='Death Behind the Canvas — '+t('title2');
  drawGender();if(gender){renderC();renderJ()}
  if(done)fillDos();
}
function toggleLang(){lang=lang==='ar'?'en':'ar';applyLang()}

function show(n){
  [1,2,3].forEach(i=>{$('s'+i).classList.toggle('on',i===n);$('steps').children[i-1].classList.toggle('on',i<=n)});
  if(n===3)loadTaken();
}
function err(id,on){$(id).classList.toggle('show',on)}

function nxt(from){
  if(from===1){
    const a=$('nm').value.trim().length>=3,b=/^[0-9+\s-]{8,}$/.test($('ph').value.trim());
    err('e1',!a);err('e2',!b);if(a&&b)show(2);
  }else{
    err('e3',!gender);if(!gender)return;
    renderC();renderJ();show(3);
  }
}

function drawGender(){
  const g=$('gd');g.innerHTML='';
  [['female','gf','gfs'],['male','gm','gms']].forEach(x=>{
    g.appendChild(card(t(x[1]),t(x[2]),false,gender===x[0],()=>{gender=x[0];ch=null;jb=null;err('e3',false);drawGender()}));
  });
}

function card(label,sub,taken,sel,click){
  const d=document.createElement('div');
  d.className='opt'+(taken?' lock':'')+(sel?' sel':'');
  const s=document.createElement('span');
  const n=document.createElement('span');n.className='nm';n.textContent=label;s.appendChild(n);
  if(sub){const sm=document.createElement('small');sm.textContent=sub;s.appendChild(sm)}
  d.appendChild(s);
  if(taken){const e=document.createElement('em');e.textContent=t('taken');d.appendChild(e)}
  else d.onclick=click;
  return d;
}

function renderC(){
  const list=gender==='female'?F:M,g=$('cg');g.innerHTML='';
  $('cc').textContent='('+list.filter(x=>!tc.includes(x[0])).length+' '+t('avail')+')';
  list.forEach(x=>g.appendChild(card(chTxt(x),lang==='en'?x[1]:x[2],tc.includes(x[0]),ch&&ch[0]===x[0],()=>{ch=x;err('e4',false);renderC()})));
}
function renderJ(){
  const g=$('jg');g.innerHTML='';
  $('jc').textContent='('+J.filter(x=>!tj.includes(x[0])).length+' '+t('avail')+')';
  J.forEach(x=>g.appendChild(card(jobTxt(x),'',tj.includes(x[0]),jb&&jb[0]===x[0],()=>{jb=x;err('e5',false);renderJ()})));
}

async function loadTaken(){
  if(!ok_())return;
  try{
    const r=await fetch(URL_+'?t='+Date.now()),d=await r.json();
    tc=d.characters||[];tj=LOCK_JOBS?(d.jobs||[]):[];
    if(ch&&tc.includes(ch[0]))ch=null;
    if(jb&&tj.includes(jb[0]))jb=null;
    if(gender){renderC();renderJ()}
  }catch(e){console.error(e)}
}

function fillDos(){
  $('d1').textContent=$('nm').value.trim();$('d2').textContent=$('ph').value.trim();
  $('d3').textContent=chTxt(ch);$('d4').textContent=jobTxt(jb);
}

async function send(){
  err('e6',false);
  err('e4',!ch);err('e5',!jb);if(!ch||!jb)return;
  if(!ok_()){$('e6').textContent=t('enourl');err('e6',true);return}
  const b=$('sb');b.disabled=true;
  try{
    // الشيت بيستقبل دايمًا بالعربي
    const r=await fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({
      name:$('nm').value.trim(),phone:$('ph').value.trim(),gender:gender==='female'?'أنثى':'ذكر',
      character:ch[1],characterId:ch[0],job:gender==='female'?jb[2]:jb[1],jobId:jb[0]})});
    const d=await r.json();
    if(d.status==='taken'){await loadTaken();$('e6').textContent=t('etaken');err('e6',true);return}
    if(d.status!=='ok')throw new Error(d.message);
    done=true;fillDos();
    [1,2,3].forEach(i=>$('s'+i).classList.remove('on'));$('steps').style.display='none';$('ok').style.display='block';
  }catch(e){console.error(e);$('e6').textContent=t('enet');err('e6',true)}
  finally{b.disabled=false}
}

applyLang();loadTaken();
</script>
